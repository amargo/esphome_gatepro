name: ESPHome Compile

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: esphome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Protocol unit tests
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I components/gatepro tests/test_protocol.cpp -o build/test_protocol
          ./build/test_protocol

  compile:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        file:
          - gatepro_boxer_example.yaml
          - gatepro_boxer_local.yaml
        esphome-version:
          - stable
          - dev
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.esphome
          key: ${{ runner.os }}-esphome-cache-${{ matrix.esphome-version }}
          restore-keys: |
            ${{ runner.os }}-esphome-cache

      # Run ESPHome build action
      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@v6
        with:
          yaml-file: examples/${{ matrix.file }}
          version: ${{ matrix.esphome-version }}
          complete-manifest: true

      # Collect firmware artifacts
      - name: Collect all firmware from output folders
        run: |
          VERSION=${{ matrix.esphome-version }}
          mkdir -p output
          for d in *-*; do
            if [ -d "$d" ]; then
              SUBDIR=$(basename "$d")
              for f in "$d"/*.bin "$d"/*.elf; do
                if [ -f "$f" ]; then
                  EXT="${f##*.}"
                  cp "$f" "output/${SUBDIR}-firmware-${VERSION}.$EXT"
                fi
              done
              # Copy manifest.json if exists
              if [ -f "$d/manifest.json" ]; then
                cp "$d/manifest.json" "output/${SUBDIR}-firmware-${VERSION}.manifest.json"
              fi
            fi
          done

      # Upload artifacts
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.file }}-${{ matrix.esphome-version }}
          path: output
